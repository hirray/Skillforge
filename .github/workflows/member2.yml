name: Member 2 intelligence
on:
  push:
    branches: ['codex/**', 'member2/**']
  pull_request:
jobs:
  member2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run setup:member2
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:member2-contract
      - run: npm run check:member2-migrations
      - run: npm run test:member2
      - run: npm run build -w apps/web
      - run: npm run build -w apps/api
      - run: npm run eval:matching
